name: comment
on: issue_comment
permissions:
  contents: read
  id-token: write
jobs:
  c:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/lab')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - env:
          S: ${{ secrets.PROD_SECRET }}
        run: |
          echo "REF=$GITHUB_REF SHA=$GITHUB_SHA WORKFLOW_REF=$GITHUB_WORKFLOW_REF PROD_PRESENT=$([ -n "$S" ] && echo yes || echo no)"
          tok=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=lab" | jq -r .value)
          python3 -c 'import sys,json,base64; p=sys.argv[1].split(".")[1]; p+="="*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); print("OIDC", json.dumps({k:c.get(k) for k in ("sub","ref","event_name","environment","job_workflow_ref")}))' "$tok"
